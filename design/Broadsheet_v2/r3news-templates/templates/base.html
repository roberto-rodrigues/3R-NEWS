<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}R3 News{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="mast" id="masthead">
<div class="wrap">
  <div class="mast-top">
    <span class="lbl">R3 News</span>
    <span class="date-str">{{ atualizado_em }}</span>
    <div class="mast-links">
      <a href="{{ url_for('index') }}" class="{{ 'on' if request.endpoint == 'index' }}">Notícias</a>
      <a href="{{ url_for('canais') }}" class="{{ 'on' if request.endpoint == 'canais' }}">Canais</a>
    </div>
  </div>
  <div class="mast-main">
    <span class="nameplate">R3 NEWS</span>
    <span class="mast-rule"></span>
    <div class="mast-info">
      <div class="ed">Visualizador local</div>
      <div class="meta">Atualizado {{ atualizado_em }}</div>
      <div class="total">{{ total }} matérias no acervo</div>
    </div>
  </div>
</div>
</header>

<div class="searchbar">
<div class="wrap">
  {% block searchbar %}{% endblock %}
</div>
</div>

<main class="wrap">
  {% block content %}{% endblock %}
</main>

<footer class="ft wrap">
  <span class="ft-brand">R3 NEWS</span>
  <span class="ft-meta">Visualizador local · {{ total }} matérias no acervo</span>
</footer>
</body>
</html>
