<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}R3 News{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="mast">
  <div class="wrap mast-in">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="mark"></span>R3 News
    </a>
    <nav class="top">
      <a href="{{ url_for('index') }}"
         class="{{ 'on' if request.endpoint == 'index' }}">Notícias</a>
      <a href="{{ url_for('canais') }}"
         class="{{ 'on' if request.endpoint == 'canais' }}">Canais</a>
    </nav>
    <div class="mast-meta">
      <div class="lbl">Atualizado</div>
      <small>{{ atualizado_em }}</small>
    </div>
  </div>
</header>

<main class="wrap">
  {% block content %}{% endblock %}
</main>

<footer class="footer wrap">
  R3 News · visualizador local · {{ total }} matérias no acervo
</footer>
</body>
</html>
