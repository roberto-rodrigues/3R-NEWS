name: Collect news

on:
  schedule:
    # O evento `schedule` do GitHub Actions e best-effort: as execucoes entram numa
    # fila de baixa prioridade e chegam a atrasar horas, principalmente perto da virada
    # da hora. Agendar de 10 em 10 min absorve esse jitter para que, na pratica, a coleta
    # aconteca pelo menos a cada 30 min. Em repositorio publico os minutos sao gratuitos.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

# Evita que execucoes atrasadas se acumulem e rodem em paralelo sobre o mesmo banco.
concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/run_collect.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
